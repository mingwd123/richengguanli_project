services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME:-dayline}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - dayliane_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-dayline}
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      TRUST_FORWARDED_HEADERS: ${TRUST_FORWARDED_HEADERS:-false}
      EMAIL_REGISTRATION_ENABLED: ${EMAIL_REGISTRATION_ENABLED:-true}
      EMAIL_OTP_SECRET: ${EMAIL_OTP_SECRET:?Set EMAIL_OTP_SECRET in .env}
      EMAIL_OTP_TTL: ${EMAIL_OTP_TTL:-5m}
      EMAIL_OTP_RESEND_COOLDOWN: ${EMAIL_OTP_RESEND_COOLDOWN:-60s}
      EMAIL_OTP_MAX_ATTEMPTS: ${EMAIL_OTP_MAX_ATTEMPTS:-5}
      EMAIL_OTP_MAX_PER_EMAIL_PER_DAY: ${EMAIL_OTP_MAX_PER_EMAIL_PER_DAY:-10}
      EMAIL_OTP_MAX_PER_IP_PER_HOUR: ${EMAIL_OTP_MAX_PER_IP_PER_HOUR:-30}
      TENCENT_SES_ENABLED: ${TENCENT_SES_ENABLED:-false}
      TENCENT_SES_REGION: ${TENCENT_SES_REGION:-}
      TENCENT_SES_SECRET_ID: ${TENCENT_SES_SECRET_ID:-}
      TENCENT_SES_SECRET_KEY: ${TENCENT_SES_SECRET_KEY:-}
      TENCENT_SES_FROM_EMAIL: ${TENCENT_SES_FROM_EMAIL:-}
      TENCENT_SES_TEMPLATE_ID: ${TENCENT_SES_TEMPLATE_ID:-}
      TENCENT_SES_REPLY_TO: ${TENCENT_SES_REPLY_TO:-}
      REMINDER_SCAN_TOKEN: ${REMINDER_SCAN_TOKEN:?Set REMINDER_SCAN_TOKEN in .env}
      DEMO_DATA_ENABLED: "false"
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_PROVIDER: ${AI_PROVIDER:-deepseek}
      AI_MODEL: ${AI_MODEL:-deepseek-chat}
      AI_API_BASE_URL: ${AI_API_BASE_URL:-https://api.deepseek.com/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_API_KEY_ENCRYPTION_SECRET: ${AI_API_KEY_ENCRYPTION_SECRET:-}
      AI_ALLOWED_HOSTS: ${AI_ALLOWED_HOSTS:-api.deepseek.com}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"

  web-user:
    build:
      context: .
      dockerfile: src/web-user/Dockerfile
    depends_on:
      - backend
    ports:
      - "5173:80"

  admin-web:
    build:
      context: .
      dockerfile: src/admin-web/Dockerfile
    depends_on:
      - backend
    ports:
      - "5174:80"

volumes:
  dayliane_mysql:
