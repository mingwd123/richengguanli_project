[package]
name = "dayliane-desktop"
version = "0.1.0"
description = "Dayliane desktop application"
authors = ["Dayliane"]
edition = "2021"

[lib]
name = "dayliane_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-http = "2"
tauri-plugin-notification = "2"
