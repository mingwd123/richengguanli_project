spring:
  datasource:
    url: jdbc:h2:mem:dayline_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-test.sql

app:
  http:
    trust-forwarded-headers: false
  jwt:
    secret: test-secret-for-dayliane-acceptance-tests
  email:
    registration-enabled: true
    otp-secret: test-secret-for-dayliane-email-otp-digests
    otp-ttl: 5m
    resend-cooldown: 60s
    max-attempts: 5
    max-per-email-per-day: 10
    max-per-ip-per-hour: 30
    tencent-ses:
      enabled: false
  reminder:
    scheduler-enabled: false
  ai:
    api-key: environment-fallback-ai-key
    api-key-encryption-secret: test-ai-config-encryption-secret
    allowed-hosts: 8.8.8.8,127.0.0.1
