spring:
  datasource:
    url: jdbc:h2:mem:dayline_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-test.sql

app:
  jwt:
    secret: test-secret-for-dayliane-acceptance-tests
  reminder:
    scheduler-enabled: false
  ai:
    allowed-hosts: 8.8.8.8,127.0.0.1
