spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:dayliane}?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:mysql}
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0

app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-development}
  ai:
    enabled: ${AI_ENABLED:false}
    provider: ${AI_PROVIDER:}
    model: ${AI_MODEL:}
    api-base-url: ${AI_API_BASE_URL:}
    api-key: ${AI_API_KEY:}

