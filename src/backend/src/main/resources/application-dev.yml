spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:dayline}?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:mysql}
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0

app:
  http:
    trust-forwarded-headers: ${TRUST_FORWARDED_HEADERS:false}
  jwt:
    secret: ${JWT_SECRET:change-me-in-development}
  internal:
    reminder-scan-token: ${REMINDER_SCAN_TOKEN:change-me-in-development}
  demo-data:
    enabled: ${DEMO_DATA_ENABLED:true}
  email:
    registration-enabled: ${EMAIL_REGISTRATION_ENABLED:true}
    otp-secret: ${EMAIL_OTP_SECRET:${JWT_SECRET:change-me-in-development}}
    otp-ttl: ${EMAIL_OTP_TTL:5m}
    resend-cooldown: ${EMAIL_OTP_RESEND_COOLDOWN:60s}
    max-attempts: ${EMAIL_OTP_MAX_ATTEMPTS:5}
    max-per-email-per-day: ${EMAIL_OTP_MAX_PER_EMAIL_PER_DAY:10}
    max-per-ip-per-hour: ${EMAIL_OTP_MAX_PER_IP_PER_HOUR:30}
    tencent-ses:
      enabled: ${TENCENT_SES_ENABLED:false}
      region: ${TENCENT_SES_REGION:}
      secret-id: ${TENCENT_SES_SECRET_ID:}
      secret-key: ${TENCENT_SES_SECRET_KEY:}
      from-email: ${TENCENT_SES_FROM_EMAIL:}
      template-id: ${TENCENT_SES_TEMPLATE_ID:}
      reply-to: ${TENCENT_SES_REPLY_TO:}
  ai:
    enabled: ${AI_ENABLED:true}
    provider: ${AI_PROVIDER:deepseek}
    model: ${AI_MODEL:deepseek-chat}
    api-base-url: ${AI_API_BASE_URL:https://api.deepseek.com/v1}
    api-key: ${AI_API_KEY:}
    api-key-encryption-secret: ${AI_API_KEY_ENCRYPTION_SECRET:${JWT_SECRET:change-me-in-development}}
    allowed-hosts: ${AI_ALLOWED_HOSTS:api.deepseek.com}
    request-timeout: ${AI_REQUEST_TIMEOUT:15s}
    total-timeout: ${AI_TOTAL_TIMEOUT:45s}
