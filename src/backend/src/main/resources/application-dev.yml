spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:dayline}?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:mysql}
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0

app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-development}
  ai:
    enabled: ${AI_ENABLED:true}
    provider: ${AI_PROVIDER:deepseek}
    model: ${AI_MODEL:deepseek-chat}
    api-base-url: ${AI_API_BASE_URL:https://api.deepseek.com/v1}
    api-key: ${AI_API_KEY:sk-a50f2283b3e343d9a24723267cd24500}

