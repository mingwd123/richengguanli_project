spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:dayline}?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:mysql}
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0

app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-development}
  internal:
    reminder-scan-token: ${REMINDER_SCAN_TOKEN:change-me-in-development}
  demo-data:
    enabled: ${DEMO_DATA_ENABLED:true}
  ai:
    enabled: ${AI_ENABLED:true}
    provider: ${AI_PROVIDER:deepseek}
    model: ${AI_MODEL:deepseek-chat}
    api-base-url: ${AI_API_BASE_URL:https://api.deepseek.com/v1}
    api-key: ${AI_API_KEY:}
    api-key-encryption-secret: ${AI_API_KEY_ENCRYPTION_SECRET:${JWT_SECRET:change-me-in-development}}
    allowed-hosts: ${AI_ALLOWED_HOSTS:api.deepseek.com}
    request-timeout: ${AI_REQUEST_TIMEOUT:15s}
    total-timeout: ${AI_TOTAL_TIMEOUT:45s}
