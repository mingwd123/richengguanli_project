<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{title}}</title>
</head>
<body style="margin:0;padding:32px 16px;background:#f4f6f8;font-family:Arial,'Microsoft YaHei',sans-serif;color:#1f2937;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:560px;background:#ffffff;border-radius:12px;">
          <tr>
            <td style="padding:36px 32px;">
              <h2 style="margin:0 0 24px;text-align:center;color:#111827;font-size:24px;line-height:1.4;">{{title}}</h2>
              <p style="margin:0;font-size:15px;line-height:1.8;">{{description}}</p>
              <div style="margin:28px 0;text-align:center;">
                <span style="display:inline-block;padding:14px 28px;background:#eef2ff;border-radius:8px;color:#4f46e5;font-size:30px;line-height:1;font-weight:bold;letter-spacing:8px;">{{code}}</span>
              </div>
              <p style="margin:0 0 8px;font-size:14px;line-height:1.8;color:#6b7280;">验证码将在 <strong>{{minutes}} 分钟</strong> 后失效，仅可使用一次。</p>
              <p style="margin:0;font-size:14px;line-height:1.8;color:#6b7280;">请勿将验证码透露给任何人。如非本人操作，请忽略此邮件。</p>
              <hr style="margin:28px 0;border:0;border-top:1px solid #e5e7eb;">
              <p style="margin:0;text-align:center;font-size:12px;line-height:1.6;color:#9ca3af;">Dayliane 团队</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
