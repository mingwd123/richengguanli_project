spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

app:
  jwt:
    secret: ${JWT_SECRET}
  ai:
    enabled: ${AI_ENABLED:false}
    provider: ${AI_PROVIDER}
    model: ${AI_MODEL}
    api-base-url: ${AI_API_BASE_URL}
    api-key: ${AI_API_KEY}
